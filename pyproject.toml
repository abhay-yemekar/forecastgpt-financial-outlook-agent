[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# E501: long lines here are mostly prompt prose / log f-strings.
# B008: FastAPI's Depends() in argument defaults is idiomatic.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
