services:
  redis:
    image: redis:7-alpine
    # Project-unique name so this redis can never be confused with any other
    # redis container on the host.
    container_name: forecastgpt-redis
    # Host port is configurable and deliberately defaults to 6380 — 6379 is
    # commonly already bound by other local services. Inside the compose
    # network it is always plain 6379.
    ports:
      - "${REDIS_PORT:-6380}:6379"

  # Full local stack: `docker compose up --build api worker`
  # (add `--profile mysql` for a prod-like MySQL instead of the SQLite fallback).
  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: ${DATABASE_URL:-}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-forecastgpt}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-forecastgpt}
      MYSQL_DB: ${MYSQL_DB:-forecastgpt}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-llama3.2}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      # Reach a host-installed Ollama from containers:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      RATE_LIMIT_GET_PER_MINUTE: ${RATE_LIMIT_GET_PER_MINUTE:-120}
      # EMBED_WORKER=1 makes this single service run its own worker
      # (single-container mode) — keep 0 when the separate worker runs.
      EMBED_WORKER: ${EMBED_WORKER:-0}
    depends_on:
      - redis

  worker:
    build: .
    command: python -m app.worker
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: ${DATABASE_URL:-}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-forecastgpt}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-forecastgpt}
      MYSQL_DB: ${MYSQL_DB:-forecastgpt}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-llama3.2}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      RATE_LIMIT_GET_PER_MINUTE: ${RATE_LIMIT_GET_PER_MINUTE:-120}
      # EMBED_WORKER=1 makes this single service run its own worker
      # (single-container mode) — keep 0 when the separate worker runs.
      EMBED_WORKER: ${EMBED_WORKER:-0}
    depends_on:
      - redis

  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    environment:
      MYSQL_ROOT_PASSWORD: forecastgpt
      MYSQL_USER: forecastgpt
      MYSQL_PASSWORD: forecastgpt
      MYSQL_DATABASE: forecastgpt
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
