name: Bug report
description: Something is broken or behaves differently than documented.
title: "fix: "
labels: ["type:fix"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. POST /forecasts with {"company": "TCS", ...}
        2. Poll /forecasts/<id>
        3. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Live site
        - API
        - Local (docker compose)
        - Local (uvicorn + npm run dev)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, job id, or screenshots
      description: Strip API keys, provider keys, and session tokens before pasting.
      render: shell
