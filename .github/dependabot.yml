version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels: ["type:chore", "area:api"]
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # The LangChain family must move as one coherent release train (#17,
      # #18); it is being removed in the LLM-layer phase. No majors until then.
      - dependency-name: "langchain*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    labels: ["type:chore", "area:web"]
    groups:
      web-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["type:chore", "area:infra"]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: ["type:chore", "area:infra"]
    ignore:
      # Runtime versions are pinned on purpose (Python 3.12 matches CI and the
      # pinned wheels; Node 22 LTS); move them deliberately, not by bot.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
